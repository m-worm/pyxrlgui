name: Build

# Builds the self-contained bundle and installer on all three platforms.
# PyInstaller cannot cross-compile, so each artifact is built on its own runner.
# Pushing a v* tag also publishes a draft GitHub Release with every artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
          - os: macos-14
            name: macOS arm64
          - os: macos-13
            name: macOS x86_64
          # Built on the oldest supported runner so the AppImage works on
          # older glibc than the runner's own.
          - os: ubuntu-22.04
            name: Linux x86_64

    steps:
      - uses: actions/checkout@v4

      # xraylib is a C library. conda-forge is the route its own documentation
      # recommends and is the only one packaged for all three platforms.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: xrayexplorer
          create-args: >-
            python=3.12
            xraylib
          init-shell: bash
          cache-environment: true

      - name: Install Python dependencies
        shell: bash -el {0}
        run: python -m pip install --upgrade pip PySide6 matplotlib numpy pyinstaller

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libfontconfig1

      - name: Install appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
          # AppImages need FUSE, which GitHub runners lack, so extract instead.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build
        shell: bash -el {0}
        run: python packaging/build.py --clean

      - name: Verify the frozen bundle
        shell: bash -el {0}
        env:
          QT_QPA_PLATFORM: offscreen
          XRAYEXPLORER_SELFTEST: "1"
        run: |
          case "${{ runner.os }}" in
            Windows) "dist/X-ray Explorer/XrayExplorer.exe" ;;
            macOS)   "dist/X-ray Explorer.app/Contents/MacOS/XrayExplorer" ;;
            *)       "dist/X-ray Explorer/XrayExplorer" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/installer/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
